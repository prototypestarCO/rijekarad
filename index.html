<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rijeka Red AI - Pametni Redar</title>
    <!-- Učitavanje TensorFlow.js modela za analizu slika -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --primarna: #005bac; --akcent: #e63946; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .app-container { background: white; max-width: 500px; width: 100%; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .preview-box { width: 100%; min-height: 200px; border: 2px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 15px 0; background: #000; position: relative; }
        video, img { width: 100%; height: auto; display: block; }
        .ai-badge { background: #d1e7ff; color: #005bac; padding: 5px 12px; border-radius: 15px; font-size: 0.85em; font-weight: bold; display: none; margin-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--akcent); color: white; }
        .btn-camera { background: #2a9d8f; color: white; }
        .btn-save { background: #eee; color: #333; font-size: 0.8em; }
        #canvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>🤖 Rijeka Red <span style="color:var(--akcent)">AI</span></h2>
    
    <div id="user-section">
        <input type="text" id="user_name" placeholder="Ime i Prezime">
        <input type="text" id="user_phone" placeholder="Kontakt telefon">
        <button class="btn btn-save" onclick="saveUserData()">Spremi podatke</button>
    </div>

    <hr>

    <label>📷 Kamera / Analiza:</label>
    <!-- Gumb za aktivaciju kamere unutar diva -->
    <button class="btn btn-camera" onclick="pokreniKameru()">OTVORI KAMERU</button>
    
    <div class="preview-box" id="previewContainer">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <button class="btn btn-save" id="captureBtn" style="display:none;" onclick="uslikaj()">USLIKAJ I ANALIZIRAJ</button>

    <div id="aiBadge" class="ai-badge">AI ANALIZA: <span id="detectedType">Skeniram...</span></div>

    <label>📍 Lokacija (GPS):</label>
    <input type="text" id="lokacija" placeholder="Dohvaćam koordinate...">

    <label>📝 Opis (AI generirano):</label>
    <textarea id="opis" rows="3"></textarea>

    <button class="btn btn-main" onclick="posaljiSve()">POŠALJI PRIJAVU</button>
</div>

<script>
let model;

// Učitavanje AI modela pri pokretanju
async function loadAI() {
    model = await mobilenet.load();
    console.log("Model učitan!");
}
loadAI();

window.onload = () => {
    document.getElementById('user_name').value = localStorage.getItem('ri_name') || "";
    document.getElementById('user_phone').value = localStorage.getItem('ri_phone') || "";
    dohvatiGPS();
};

// --- FUNKCIJA KAMERE ---
async function pokreniKameru() {
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        document.getElementById('captureBtn').style.display = 'block';
    } catch (err) {
        alert("Greška s kamerom: " + err);
    }
}

async function uslikaj() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Zaustavi kameru nakon slikanja
    video.srcObject.getTracks().forEach(track => track.stop());
    video.style.display = 'none';
    canvas.style.display = 'block';
    
    analizirajSliku(canvas);
}

// --- AI ANALIZA ---
async function analizirajSliku(imageElement) {
    const badge = document.getElementById('aiBadge');
    const typeSpan = document.getElementById('detectedType');
    badge.style.display = 'block';
    typeSpan.innerText = "Analiziram...";

    if (!model) await loadAI();
    
    // Prava analiza pomoću TensorFlow.js
    const predictions = await model.classify(imageElement);
    
    // Uzimamo prvi rezultat (najvjerojatniji)
    const rezultat = predictions[0].className;
    typeSpan.innerText = rezultat;
    document.getElementById('opis').value = `AI detekcija objekta: ${rezultat}. Molimo provjeriti stanje na lokaciji.`;
}

function saveUserData() {
    localStorage.setItem('ri_name', document.getElementById('user_name').value);
    localStorage.setItem('ri_phone', document.getElementById('user_phone').value);
    alert("Podaci spremljeni!");
}

function dohvatiGPS() {
    navigator.geolocation.getCurrentPosition(p => {
        document.getElementById('lokacija').value = `${p.coords.latitude}, ${p.coords.longitude}`;
    }, () => {
        document.getElementById('lokacija').value = "GPS nedostupan";
    });
}

function posaljiSve() {
    const ime = document.getElementById('user_name').value || "Građanin";
    const tel = document.getElementById('user_phone').value || "/";
    const body = `Prijavitelj: ${ime}\nKontakt: ${tel}\nLokacija: ${document.getElementById('lokacija').value}\n\nProblem:\n${document.getElementById('opis').value}`;
    window.location.href = `mailto:komunalno.redarstvo@rijeka.hr?subject=Prijava&body=${encodeURIComponent(body)}`;
}
</script>

</body>
</html>
